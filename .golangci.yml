version: "2"

linters:
  default: standard
  enable:
    - nolintlint
  settings:
    govet:
      enable:
        - nilness
        - shadow
    nolintlint:
      require-specific: true
      require-explanation: true
    staticcheck:
      checks: [all]
  exclusions:
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
